name: Deploy to Cloud Run

# Manual or on a release tag. Needs repository secrets:
#   GCP_PROJECT_ID, GCP_WORKLOAD_IDENTITY_PROVIDER, GCP_SERVICE_ACCOUNT
# and Secret Manager secrets GEMINI_API_KEY and STAFF_PIN in the project.
on:
  workflow_dispatch:
    inputs:
      region:
        description: Cloud Run region
        default: asia-south1
  push:
    tags: ["v*"]

permissions:
  contents: read
  id-token: write

env:
  SERVICE: cafe-companion
  REGION: ${{ github.event.inputs.region || 'asia-south1' }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Build and push with Cloud Build
        run: |
          gcloud builds submit \
            --project "${{ secrets.GCP_PROJECT_ID }}" \
            --tag "${REGION}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/apps/${SERVICE}:${GITHUB_SHA}" .

      - id: deploy
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: ${{ env.SERVICE }}
          region: ${{ env.REGION }}
          project_id: ${{ secrets.GCP_PROJECT_ID }}
          image: ${{ env.REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/apps/${{ env.SERVICE }}:${{ github.sha }}
          flags: --allow-unauthenticated --min-instances=0 --max-instances=4 --memory=512Mi --cpu=1 --concurrency=80
          env_vars: |
            GEMINI_MODEL=gemini-3.8-flash
            FIRESTORE_ENABLED=true
            GOOGLE_CLOUD_PROJECT=${{ secrets.GCP_PROJECT_ID }}
          secrets: |
            GEMINI_API_KEY=GEMINI_API_KEY:latest
            STAFF_PIN=STAFF_PIN:latest

      - name: Smoke test
        run: curl -fsS "${{ steps.deploy.outputs.url }}/api/health"
